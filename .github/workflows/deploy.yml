# Push to main → pull, build, restart Next.js on EC2.
# Repo secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY
name: Deploy frontend (production)

on:
  push:
    branches: [main]

concurrency:
  group: afarm-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /srv/afarm/afarm-frontend
            bash deploy/aws/deploy-frontend.sh